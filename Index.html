<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
</head>
<body>
  <div class="calc">
    <h1>Calculadora</h1>
    <input type="number" id="num1" placeholder="Primeiro número" step="any">
    <input type="number" id="num2" placeholder="Segundo número" step="any">

    <div class="botoes">
      <button data-op="soma">+</button>
      <button data-op="subtracao">−</button>
      <button data-op="multiplicacao">×</button>
      <button data-op="divisao">÷</button>
    </div>

    <div id="resultado"></div>
    <pre id="json"></pre>
  </div>

  <script>
    const divResultado = document.getElementById('resultado');
    const preJson = document.getElementById('json');

    async function calcular(operacao) {
      const num1 = document.getElementById('num1').value;
      const num2 = document.getElementById('num2').value;

      if (num1 === '' || num2 === '') {
        mostrarErro('Preencha os dois números.');
        return;
      }

      try {
        // Envia a requisição para o PHP em JSON
        const resposta = await fetch('calculadora.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ num1, num2, operacao })
        });

        // Recebe a resposta do PHP já convertida de JSON
        const dados = await resposta.json();

        // Mostra o JSON formatado (identado com 2 espaços)
        preJson.textContent = JSON.stringify(dados, null, 2);

        if (dados.sucesso) {
          divResultado.className = '';
          divResultado.textContent = `${dados.expressao} = ${dados.resultado}`;
        } else {
          mostrarErro(dados.erro);
        }
      } catch (e) {
        mostrarErro('Erro ao conectar com o servidor.');
        console.error(e);
      }
    }

    function mostrarErro(msg) {
      divResultado.className = 'erro';
      divResultado.textContent = msg;
    }

    document.querySelectorAll('button[data-op]').forEach(botao => {
      botao.addEventListener('click', () => calcular(botao.dataset.op));
    });
  </script>
</body>
</html>
