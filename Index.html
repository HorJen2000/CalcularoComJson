<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function Calcula() {
            let a = document.getElementById("a").value;
            let b = document.getElementById("b").value;
            let op = document.getElementById("op").value;
            console.log(a);
            console.log(b);
            console.log(op);
            let msg  = "Calcular: a " + a + " " + op + " b " + b;
            document.getElementById("msg").innerHTML = msg;

            let xmlhttp = new XMLHttpRequest();
            console.log("1");
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    console.log("Chegou a resposta OK: " + this.responseText);
                    console.log("2");

                    // Converte o texto JSON recebido do PHP em objeto
                    let resposta = JSON.parse(this.responseText);

                    // Coloca o resultado (ou o erro) na tela
                    if (resposta.sucesso) {
                        document.getElementById("msg").innerHTML =
                            "Resultado: " + resposta.a + " " + resposta.op + " " +
                            resposta.b + " = " + resposta.resultado;
                    } else {
                        document.getElementById("msg").innerHTML = "Erro: " + resposta.erro;
                    }
                } else
                    if (this.readyState < 4) {
                        console.log("3: " + this.readyState);
                    } else
                        console.log("Requisicao falhou: " + this.status);
            }
            console.log("4");
            // encodeURIComponent é necessário: sem ele o "+" chega no PHP como espaço
            xmlhttp.open("GET", "ex02_soma.php?a=" + encodeURIComponent(a) +
                            "&b=" + encodeURIComponent(b) +
                            "&op=" + encodeURIComponent(op));
            xmlhttp.send();
            console.log("enviei form");
            console.log("5");

        }
    </script>
</head>
<body>
    <form action="" method="GET" name="frmCalc" id="frmCalc">
      a: <input type="text" name="a" id="a"> <br>
      operador: <input type="text" name="op" id="op"><br>
      b: <input type="text" name="b" id="b">
        <input type="button" value="Enviar" onclick="Calcula()">
    </form>
    <br><br>
    <p id="msg"></p>
</body>
</html>
